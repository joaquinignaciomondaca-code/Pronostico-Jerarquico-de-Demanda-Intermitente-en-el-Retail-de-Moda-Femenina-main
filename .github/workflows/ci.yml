name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar todos los scripts
        run: python -m compileall -q 01_modelos_base "02_modelo_final" run_all_benchmarks.py

      - name: Tests de las fórmulas de benchmark
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest
          pytest -q tests/
